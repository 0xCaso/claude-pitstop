<title id="t">pitstop: 57% fewer tokens re-read</title>
<desc id="d">Context size per turn in an illustrative session of 146 turns growing by 4K tokens a turn. Without pitstop it climbs to 600K. With pitstop it drops back to 70K each time it passes 226K, so about 57% fewer tokens are re-read over the session.</desc>
