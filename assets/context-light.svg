<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="t d">
<title id="t">Every turn re-reads the whole context</title>
<desc id="d">Illustrative session of 146 turns growing by 4K tokens per turn. Without pitstop the context climbs to about 600K. With pitstop it drops back to 70K every time it passes 226K, so about 57% fewer tokens are re-read over the session.</desc>
